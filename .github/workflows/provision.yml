name: IDP Infrastructure Provisioning

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON payload enviado pelo IDP Portal'
        required: true
        type: string

permissions:
  contents: write    # necessário para commitar o infra-state.json
  actions: read

jobs:
  validate:
    name: Validate Payload
    runs-on: ubuntu-latest
    outputs:
      provider: ${{ steps.parse.outputs.provider }}
      resources: ${{ steps.parse.outputs.resources }}
    steps:
      - name: Parse and validate payload
        id: parse
        run: |
          echo '${{ inputs.payload }}' > /tmp/payload.json
          
          # Valida JSON
          python3 -c "import json, sys; json.load(open('/tmp/payload.json'))" || {
            echo "ERRO: Payload JSON inválido"
            exit 1
          }
          
          PROVIDER=$(jq -r '.provider' /tmp/payload.json)
          RESOURCES=$(jq -r '.resources | length' /tmp/payload.json)
          
          echo "provider=$PROVIDER" >> $GITHUB_OUTPUT
          echo "resources=$RESOURCES" >> $GITHUB_OUTPUT
          
          echo "✓ Payload válido: $RESOURCES recurso(s) para $PROVIDER"

  provision:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_PAT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.0'

      - name: Parse payload
        id: payload
        run: |
          echo '${{ inputs.payload }}' > /tmp/payload.json
          
          PROVIDER=$(jq -r '.provider' /tmp/payload.json)
          ENVIRONMENT=$(jq -r '.environment' /tmp/payload.json)
          TIMESTAMP=$(jq -r '.timestamp' /tmp/payload.json)
          
          echo "provider=$PROVIDER" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

  notify:
    name: Notify Result
    runs-on: ubuntu-latest
    needs: provision
    if: always()
    steps:
      - name: Summary
        run: |
          if [ "${{ needs.provision.result }}" == "success" ]; then
            echo "## ✅ Provisionamento Concluído" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** Sucesso" >> $GITHUB_STEP_SUMMARY
            echo "**Run:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Falha no Provisionamento" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ${{ needs.provision.result }}" >> $GITHUB_STEP_SUMMARY
          fi
